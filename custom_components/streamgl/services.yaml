start_recording:
  fields:
    streamgl:
      required: true
      example: "streamgl.mystream"
      selector:
        text:
    trigger:
      default: "manual"
      example: "manual"
      selector:
        text:
    duration:
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: seconds
    lookback:
      default: 0
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: seconds

stop_recording:
  fields:
    streamgl:
      required: true
      example: "streamgl.mystream"
      selector:
        text:
    trigger:
      default: "manual"
      example: "manual"
      selector:
        text:

